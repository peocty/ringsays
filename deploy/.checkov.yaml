# Checkov findings accepted on purpose (reviewed in stage 8). Anything else fails the build.
skip-check:
  # Digests are pinned at release (kustomize edit set image ...@sha256); templates carry names only.
  - CKV_K8S_43
  # With immutable digests, IfNotPresent is correct; Always only adds registry load and a start dependency.
  - CKV_K8S_15
  # No CPU limits by design: limits cause throttling under load; CPU requests and autoscaling instead.
  - CKV_K8S_11
  # Worker serves no traffic: liveness (heartbeat file) is the right signal, readiness has no meaning.
  - CKV_K8S_9
  # nginx-unprivileged image runs as its built in uid 101; a different uid is not verified for that image.
  - CKV_K8S_40
  # NATS password must be an environment variable: nats.conf expands only environment variables.
  - CKV_K8S_35
  # Terraform (Google Cloud)
  # Cloud SQL ssl_mode ENCRYPTED_ONLY enforces TLS; the check looks for the older require_ssl field.
  - CKV_GCP_6
  # PostgreSQL 16 is the version RingSays is tested on; upgrade is a planned change, not a default.
  - CKV_GCP_79
  # Statement and duration logging are off on purpose: they would put customer values in logs.
  - CKV_GCP_111
  - CKV2_GCP_13
  - CKV_GCP_108
  - CKV_GCP_109
  # GKE Autopilot always runs the metadata server, Dataplane V2 network policy, no client certificates
  # and intranode visibility rules of its own; these checks do not recognise Autopilot.
  - CKV_GCP_69
  - CKV_GCP_12
  - CKV_GCP_13
  - CKV_GCP_61
  # Google Groups for RBAC needs the organisation's Workspace group; set authenticator_groups_config
  # when the platform team's group exists.
  - CKV_GCP_65
  # Access logs bucket and state bucket: logging them into themselves is circular.
  - CKV_GCP_62
  # Federation condition pins repository and ref (main, release tags); the check expects another form.
  - CKV_GCP_125
  # Evidence bucket keeps no versions on purpose: a document deleted on request must be gone (PDPL);
  # a 7 day soft delete covers operator mistakes. State and access log buckets keep versioning.
  - CKV_GCP_78
