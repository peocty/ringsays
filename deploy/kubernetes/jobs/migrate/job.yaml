# Database migrations as ringsays_owner. The release pipeline runs this before rolling out a new
# image (deletes the previous Job, applies, waits for completion); see deploy/README.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: ringsays-migrate
  labels: { app.kubernetes.io/name: ringsays-migrate, app.kubernetes.io/component: migrations }
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: ringsays-migrate, ringsays.io/db-client: "true" }
    spec:
      serviceAccountName: ringsays-jobs
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001 # secret files (mode 0400) readable through the group
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ringsays/api
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - { name: RINGSAYS_SETTINGS_DIR, value: /var/run/secrets/ringsays }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: tls-ca, mountPath: /etc/ringsays/tls, readOnly: true }
            # Secrets as files (one per setting), not environment variables.
            - { name: secrets, mountPath: /var/run/secrets/ringsays, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
        - name: tls-ca
          secret: { secretName: ringsays-tls-ca, optional: true, defaultMode: 0444 }
        - name: secrets
          secret: { secretName: ringsays-migrate-secrets, defaultMode: 0400 }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: ringsays-migrate-secrets }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: ringsays }
  target: { name: ringsays-migrate-secrets, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - { secretKey: RINGSAYS_MIGRATION_DATABASE_URL, remoteRef: { key: ringsays-db-url-owner } }
