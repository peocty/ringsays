# One time database preparation as the managed service's admin user (and again after a password
# rotation): roles, passwords, database ownership. Not part of normal releases.
apiVersion: batch/v1
kind: Job
metadata:
  name: ringsays-db-bootstrap
  labels: { app.kubernetes.io/name: ringsays-db-bootstrap, app.kubernetes.io/component: bootstrap }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: ringsays-db-bootstrap, ringsays.io/db-client: "true" }
    spec:
      serviceAccountName: ringsays-jobs
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001 # secret files (mode 0400) readable through the group
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          image: ringsays/api
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.scripts.bootstrap_db"]
          env:
            - { name: RINGSAYS_SETTINGS_DIR, value: /var/run/secrets/ringsays }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: tls-ca, mountPath: /etc/ringsays/tls, readOnly: true }
            # Secrets as files (one per setting), not environment variables.
            - { name: secrets, mountPath: /var/run/secrets/ringsays, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
        - name: tls-ca
          secret: { secretName: ringsays-tls-ca, optional: true, defaultMode: 0444 }
        - name: secrets
          secret: { secretName: ringsays-bootstrap-secrets, defaultMode: 0400 }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: ringsays-bootstrap-secrets }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: ringsays }
  # Deleted with the Job's kustomization: the admin credential does not stay in the cluster.
  target: { name: ringsays-bootstrap-secrets, creationPolicy: Owner, deletionPolicy: Delete }
  data:
    - { secretKey: RINGSAYS_BOOTSTRAP_ADMIN_URL, remoteRef: { key: ringsays-db-url-admin } }
    - { secretKey: RINGSAYS_DB_PASSWORD_OWNER, remoteRef: { key: ringsays-db-password-owner } }
    - { secretKey: RINGSAYS_DB_PASSWORD_APP, remoteRef: { key: ringsays-db-password-app } }
    - { secretKey: RINGSAYS_DB_PASSWORD_WORKER, remoteRef: { key: ringsays-db-password-worker } }
    - { secretKey: RINGSAYS_DB_PASSWORD_BACKOFFICE, remoteRef: { key: ringsays-db-password-backoffice } }
