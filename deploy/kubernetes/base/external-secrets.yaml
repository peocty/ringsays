---
# Server certificate authorities for TLS to managed PostgreSQL and Redis (mounted as files).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: ringsays-tls-ca }
spec:
  refreshInterval: 24h
  secretStoreRef: { kind: ClusterSecretStore, name: ringsays }
  target: { name: ringsays-tls-ca, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - { secretKey: postgres-ca.pem, remoteRef: { key: ringsays-postgres-server-ca } }
    - { secretKey: redis-ca.pem, remoteRef: { key: ringsays-redis-server-ca } }
