# Secrets come from the cloud secret manager through External Secrets Operator; nothing secret is in
# this repository. Each workload gets only the keys it needs. The store ("ringsays") is defined per
# cloud in components/ (GCP: Secret Manager in the environment's project, workload identity).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: ringsays-api-secrets }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: ringsays }
  target: { name: ringsays-api-secrets, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - { secretKey: RINGSAYS_DATABASE_URL, remoteRef: { key: ringsays-db-url-app } }
    - { secretKey: RINGSAYS_WORKER_DATABASE_URL, remoteRef: { key: ringsays-db-url-worker } }
    - { secretKey: RINGSAYS_REDIS_URL, remoteRef: { key: ringsays-redis-url } }
    - { secretKey: RINGSAYS_NATS_URL, remoteRef: { key: ringsays-nats-url } }
    - { secretKey: RINGSAYS_JWT_SECRET, remoteRef: { key: ringsays-jwt-secret } }
    - { secretKey: RINGSAYS_WEBHOOK_SECRET_KEY, remoteRef: { key: ringsays-webhook-secret-key } }
    - { secretKey: RINGSAYS_PHONE_PEPPER, remoteRef: { key: ringsays-phone-pepper } }
---
