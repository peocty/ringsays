    - { secretKey: RINGSAYS_WORKER_DATABASE_URL, remoteRef: { key: ringsays-db-url-worker } }
    - { secretKey: RINGSAYS_REDIS_URL, remoteRef: { key: ringsays-redis-url } }
    - { secretKey: RINGSAYS_NATS_URL, remoteRef: { key: ringsays-nats-url } }
    - { secretKey: RINGSAYS_JWT_SECRET, remoteRef: { key: ringsays-jwt-secret } }
    - { secretKey: RINGSAYS_WEBHOOK_SECRET_KEY, remoteRef: { key: ringsays-webhook-secret-key } }
    - { secretKey: RINGSAYS_PHONE_PEPPER, remoteRef: { key: ringsays-phone-pepper } }
---
