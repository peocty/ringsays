# NATS JetStream for domain events (outbox relay). Single node here; the production overlay runs a
# three node cluster. Password protected; only labelled RingSays pods may connect (network policy).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ringsays-nats-config
data:
  nats.conf: |
    port: 4222
    http_port: 8222
    server_name: $POD_NAME
    pid_file: /var/run/nats/nats.pid
    max_payload: 1MB
    jetstream {
      store_dir: /data
      max_file_store: 8GB
    }
    authorization {
      user: ringsays
      password: $NATS_PASSWORD
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ringsays-nats
  labels: { app.kubernetes.io/name: ringsays-nats, app.kubernetes.io/component: events }
spec:
  serviceName: ringsays-nats-headless
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app.kubernetes.io/name: ringsays-nats }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ringsays-nats, app.kubernetes.io/component: events }
    spec:
      serviceAccountName: ringsays-nats
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app.kubernetes.io/name: ringsays-nats } }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app.kubernetes.io/name: ringsays-nats } }
      containers:
        - name: nats
          image: nats:2.11.9-alpine
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/nats/nats.conf"]
          ports:
            - { name: client, containerPort: 4222 }
            - { name: cluster, containerPort: 6222 }
            - { name: monitor, containerPort: 8222 }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NATS_PASSWORD
              valueFrom: { secretKeyRef: { name: ringsays-nats-secrets, key: NATS_PASSWORD } }
          readinessProbe:
            httpGet: { path: "/healthz?js-enabled-only=true", port: monitor }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: "/healthz?js-enabled-only=true", port: monitor }
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop: { exec: { command: ["nats-server", "--signal", "ldm=/var/run/nats/nats.pid"] } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/nats }
            - { name: data, mountPath: /data }
            - { name: run, mountPath: /var/run/nats }
      volumes:
        - name: config
          configMap: { name: ringsays-nats-config }
        - name: run
          emptyDir: { sizeLimit: 1Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: ringsays-nats
  labels: { app.kubernetes.io/name: ringsays-nats }
spec:
  selector: { app.kubernetes.io/name: ringsays-nats }
  ports: [{ name: client, port: 4222, targetPort: client }]
---
apiVersion: v1
kind: Service
metadata:
  name: ringsays-nats-headless
  labels: { app.kubernetes.io/name: ringsays-nats }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: ringsays-nats }
  ports:
    - { name: client, port: 4222, targetPort: client }
    - { name: cluster, port: 6222, targetPort: cluster }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: ringsays-nats }
spec:
  unhealthyPodEvictionPolicy: AlwaysAllow
  maxUnavailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: ringsays-nats } }
