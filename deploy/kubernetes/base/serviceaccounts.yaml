# One identity per role, so cloud permissions (object storage, secrets) are granted per role.
# Tokens are not mounted: nothing in RingSays talks to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata: { name: ringsays-api }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: ringsays-worker }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: ringsays-backoffice }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: ringsays-portal }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: ringsays-jobs }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: ringsays-nats }
automountServiceAccountToken: false
