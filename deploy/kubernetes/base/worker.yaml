# Background jobs: delivery ladder, expiry, outbox relay, webhooks. Safe with several replicas
# (leases and SKIP LOCKED); the only component with internet egress (webhooks to organisations).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ringsays-worker
  labels: { app.kubernetes.io/name: ringsays-worker, app.kubernetes.io/component: worker }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: ringsays-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ringsays-worker, app.kubernetes.io/component: worker, ringsays.io/db-client: "true", ringsays.io/redis-client: "true", ringsays.io/nats-client: "true", ringsays.io/cloud-apis: "true", ringsays.io/webhook-egress: "true" }
    spec:
      serviceAccountName: ringsays-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: ringsays-worker } }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app.kubernetes.io/name: ringsays-worker } }
      containers:
        - name: worker
          image: ringsays/api
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          env:
            - { name: RINGSAYS_SETTINGS_DIR, value: /var/run/secrets/ringsays }
          envFrom:
            - configMapRef: { name: ringsays-config }
          livenessProbe:
            exec: { command: ["python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/worker-alive')<60 else 1)"] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec: { command: ["python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/tmp/worker-alive') else 1)"] }
            periodSeconds: 3
            failureThreshold: 40
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # Server CAs for verified TLS to PostgreSQL and Redis (referenced from the connection URLs).
            - { name: tls-ca, mountPath: /etc/ringsays/tls, readOnly: true }
            # Secrets as files (one per setting), not environment variables.
            - { name: secrets, mountPath: /var/run/secrets/ringsays, readOnly: true }
      volumes:
        - name: tls-ca
          secret: { secretName: ringsays-tls-ca, optional: true, defaultMode: 0444 }
        - name: secrets
          secret: { secretName: ringsays-worker-secrets, defaultMode: 0400 }
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: ringsays-worker }
spec:
  unhealthyPodEvictionPolicy: AlwaysAllow
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: ringsays-worker } }
