# Tenant facing API: enterprise API, RingSays app API, Context Tokens, portal admin API.
# No owner, back office or bootstrap credential is ever given to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ringsays-api
  labels: { app.kubernetes.io/name: ringsays-api, app.kubernetes.io/component: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: ringsays-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ringsays-api, app.kubernetes.io/component: api, ringsays.io/db-client: "true", ringsays.io/redis-client: "true", ringsays.io/nats-client: "true", ringsays.io/cloud-apis: "true" }
    spec:
      serviceAccountName: ringsays-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: ringsays-api } }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app.kubernetes.io/name: ringsays-api } }
      containers:
        - name: api
          image: ringsays/api
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: RINGSAYS_SETTINGS_DIR, value: /var/run/secrets/ringsays }
          envFrom:
            - configMapRef: { name: ringsays-config }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            # Let the load balancer stop sending before the server stops accepting.
            preStop: { sleep: { seconds: 10 } }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # Server CAs for verified TLS to PostgreSQL and Redis (referenced from the connection URLs).
            - { name: tls-ca, mountPath: /etc/ringsays/tls, readOnly: true }
            # Secrets as files (one per setting), not environment variables.
            - { name: secrets, mountPath: /var/run/secrets/ringsays, readOnly: true }
      volumes:
        - name: tls-ca
          secret: { secretName: ringsays-tls-ca, optional: true, defaultMode: 0444 }
        - name: secrets
          secret: { secretName: ringsays-api-secrets, defaultMode: 0400 }
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ringsays-api
  labels: { app.kubernetes.io/name: ringsays-api }
spec:
  selector: { app.kubernetes.io/name: ringsays-api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: ringsays-api }
spec:
  unhealthyPodEvictionPolicy: AlwaysAllow
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: ringsays-api } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ringsays-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ringsays-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
