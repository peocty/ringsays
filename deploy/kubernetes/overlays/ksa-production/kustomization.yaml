# Production in Google Cloud Dammam. Real providers only (the API refuses MOCK adapters here), three
# zones, autoscaling, three node NATS cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ringsays
resources:
  - ../../base
components:
  - ../../components/gcp-ksa
configMapGenerator:
  - name: ringsays-environment
    envs: [environment.env]
    options:
      annotations: { config.kubernetes.io/local-config: "true" }
  - name: ringsays-config
    behavior: merge
    envs: [config.env, identity.env]
    literals:
      - RINGSAYS_ENVIRONMENT=production
      - RINGSAYS_USE_MOCK_ADAPTERS=false
      - RINGSAYS_BLOB_BACKEND=gcs
      - RINGSAYS_NATS_STREAM_REPLICAS=3
  - name: ringsays-portal-config
    behavior: merge
    envs: [portal.env]
  - name: ringsays-backoffice-portal-config
    behavior: merge
    envs: [backoffice-portal.env]
images:
  - name: ringsays/api
    newName: me-central2-docker.pkg.dev/ringsays-ksa-production/ringsays/api
    newTag: REPLACED_BY_PIPELINE
  - name: ringsays/portal
    newName: me-central2-docker.pkg.dev/ringsays-ksa-production/ringsays/portal
    newTag: REPLACED_BY_PIPELINE
  - name: nats
    newName: me-central2-docker.pkg.dev/ringsays-ksa-production/mirror/nats
    newTag: 2.11.9-alpine
# Portals sign in against the same issuers the API trusts (one place to set them: identity.env).
replacements:
  - source: { kind: ConfigMap, name: ringsays-config, fieldPath: data.RINGSAYS_ADMIN_OIDC_ISSUER }
    targets:
      - select: { kind: ConfigMap, name: ringsays-portal-config }
        fieldPaths: ["data.OIDC_AUTHORITY"]
  - source: { kind: ConfigMap, name: ringsays-config, fieldPath: data.RINGSAYS_STAFF_OIDC_ISSUER }
    targets:
      - select: { kind: ConfigMap, name: ringsays-backoffice-portal-config }
        fieldPaths: ["data.OIDC_AUTHORITY"]
patches:
  - path: nats-cluster.yaml
  - target: { kind: StatefulSet, name: ringsays-nats }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 50Gi
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: NATS_ROUTE_0, value: "nats://route:$(NATS_PASSWORD)@ringsays-nats-0.ringsays-nats-headless:6222" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: NATS_ROUTE_1, value: "nats://route:$(NATS_PASSWORD)@ringsays-nats-1.ringsays-nats-headless:6222" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: NATS_ROUTE_2, value: "nats://route:$(NATS_PASSWORD)@ringsays-nats-2.ringsays-nats-headless:6222" }
  - target: { kind: Deployment, name: ringsays-(worker|portal) }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: Deployment, name: ringsays-(backoffice|backoffice-portal) }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: { kind: HorizontalPodAutoscaler, name: ringsays-api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
  - target: { kind: PodDisruptionBudget, name: ringsays-(api|portal) }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
