# Staging in Google Cloud Dammam: MOCK SMS and push (no customer is ever contacted), real identity
# providers, real database and storage. One replica each where that is enough.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ringsays
resources:
  - ../../base
components:
  - ../../components/gcp-ksa
configMapGenerator:
  - name: ringsays-environment
    envs: [environment.env]
    options:
      annotations: { config.kubernetes.io/local-config: "true" }
  - name: ringsays-config
    behavior: merge
    envs: [config.env]
    literals:
      - RINGSAYS_ENVIRONMENT=staging
      - RINGSAYS_USE_MOCK_ADAPTERS=true
      - RINGSAYS_JWT_ISSUER=https://api.staging.ringsays.example
      - RINGSAYS_ADMIN_OIDC_ISSUER=https://login.staging.ringsays.example
      - RINGSAYS_STAFF_OIDC_ISSUER=https://staff-login.staging.ringsays.example
      - RINGSAYS_PORTAL_ORIGINS=["https://portal.staging.ringsays.example"]
      - RINGSAYS_PORTAL_REDIRECT_URIS=["https://portal.staging.ringsays.example/auth/callback"]
      - RINGSAYS_BLOB_BACKEND=gcs
      - RINGSAYS_NATS_STREAM_REPLICAS=1
  - name: ringsays-portal-config
    behavior: merge
    literals:
      - API_BASE=https://api.staging.ringsays.example
      - OIDC_AUTHORITY=https://login.staging.ringsays.example
  - name: ringsays-backoffice-portal-config
    behavior: merge
    literals:
      - API_BASE=https://backoffice-api.staging.ringsays.internal
      - OIDC_AUTHORITY=https://staff-login.staging.ringsays.example
      - ORIGINS=["https://backoffice.staging.ringsays.internal"]
# Release pipeline pins digests: kustomize edit set image ringsays/api=...@sha256:<digest>
images:
  - name: ringsays/api
    newName: me-central2-docker.pkg.dev/ringsays-ksa-staging/ringsays/api
    newTag: staging
  - name: ringsays/portal
    newName: me-central2-docker.pkg.dev/ringsays-ksa-staging/ringsays/portal
    newTag: staging
  - name: nats
    newName: me-central2-docker.pkg.dev/ringsays-ksa-staging/mirror/nats
    newTag: 2.11.9-alpine
patches:
  - target: { kind: Deployment, name: ringsays-(api|worker|portal) }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: HorizontalPodAutoscaler, name: ringsays-api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  # One replica: a budget of "one available" would block node upgrades; allow the disruption.
  - target: { kind: PodDisruptionBudget, name: ringsays-(api|worker|portal) }
    patch: |-
      - op: remove
        path: /spec/minAvailable
      - op: add
        path: /spec/maxUnavailable
        value: 1
