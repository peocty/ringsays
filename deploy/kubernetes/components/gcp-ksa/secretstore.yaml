# Secrets from Secret Manager, regional secrets in me-central2 (data stays in the Kingdom). External
# Secrets Operator authenticates with its own workload identity (Terraform grants it accessor on these
# secrets only). PROJECT_ID is replaced from the overlay's environment values.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ringsays
spec:
  conditions:
    - namespaces: [ringsays]
  provider:
    gcpsm:
      projectID: PROJECT_ID
      location: me-central2
