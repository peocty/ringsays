# Example store: HashiCorp Vault in the Kingdom. Replace the provider block with the cloud's own
# (Oracle Vault: provider.oracle, Alibaba KMS: provider.alibaba, AWS: provider.aws with region
# me-central-2). Key names stay the same as in base/external-secrets.yaml.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ringsays
spec:
  conditions:
    - namespaces: [ringsays]
  provider:
    vault:
      server: https://vault.INTERNAL_DOMAIN
      path: ringsays
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ringsays
          serviceAccountRef: { name: external-secrets, namespace: external-secrets }
