# Runs on GitHub once repository is pushed. Same steps run locally via `make check`.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:contracts

  backend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      RINGSAYS_TEST_PG_ADMIN_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
      RINGSAYS_ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: mypy
      - run: pytest

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Portal API types match admin contract
        run: pnpm --filter @ringsays/portal check:api-types

  # Portal and mobile app (web build) end to end against one local API with MOCK adapters.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      PGPASSWORD: postgres
      RINGSAYS_ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Database roles and schema
        run: |
          psql -h 127.0.0.1 -U postgres -f infra/sql/00-roles.sql
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE ringsays OWNER ringsays_owner"
          cd backend && python -m venv .venv && .venv/bin/pip install -e ".[dev]" && .venv/bin/alembic upgrade head
      - name: Start API (local environment, MOCK sign in)
        # Every app sign in comes from one address here; lift the per address code limit for tests.
        run: cd backend && RINGSAYS_OTP_PER_IP_PER_HOUR=100000 nohup .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ringsays/portal build
      - run: pnpm --filter @ringsays/portal exec playwright install --with-deps chromium
      - run: pnpm --filter @ringsays/portal e2e
      - name: Mobile app web build (MOCK push token so MOCK push delivers to the browser)
        run: pnpm --filter @ringsays/client build && pnpm --filter @ringsays/mobile export:web
        env:
          EXPO_PUBLIC_RINGSAYS_API_BASE: http://127.0.0.1:8000
          EXPO_PUBLIC_RINGSAYS_PREVIEW_PUSH_TOKEN: mock-web
      - run: pnpm --filter @ringsays/mobile e2e
        env: { E2E_PYTHON: "${{ github.workspace }}/backend/.venv/bin/python" }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            apps/portal/test-results
            apps/mobile/test-results
            api.log

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: fs, severity: "HIGH,CRITICAL", exit-code: "1" }
