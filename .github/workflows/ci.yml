# Runs on GitHub once repository is pushed. Same steps run locally via `make check`.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:contracts

  backend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      # Sign in code limits fail closed without Redis (every OTP request would be 503).
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      RINGSAYS_TEST_PG_ADMIN_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
      RINGSAYS_ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: NATS JetStream for publisher tests
        run: |
          curl -sSL https://github.com/nats-io/nats-server/releases/download/v2.11.9/nats-server-v2.11.9-linux-amd64.tar.gz | tar xz --strip-components=1 -C /tmp nats-server-v2.11.9-linux-amd64/nats-server
          /tmp/nats-server -js -p 4222 -sd /tmp/nats &
      - name: Image dependency locks match pyproject
        run: |
          pip install uv
          for e in gcp s3; do uv pip compile pyproject.toml --extra $e --python-version 3.12 --generate-hashes --quiet -o /tmp/$e.lock; sed -i '/^#/d' /tmp/$e.lock; sed '/^#/d' requirements/$e.lock | diff -q - /tmp/$e.lock; done
      - run: ruff check app tests
      - run: mypy
      - run: pytest

  # Managed PostgreSQL has no superuser: bootstrap and migrate as a CREATEROLE admin, like Cloud SQL.
  managed-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      RINGSAYS_ENVIRONMENT: local
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Admin like Cloud SQL (CREATEROLE, CREATEDB, not superuser)
        run: psql -h 127.0.0.1 -U postgres -c "CREATE ROLE cloud_admin LOGIN CREATEROLE CREATEDB NOSUPERUSER PASSWORD 'cloud_admin'"
      - name: Bootstrap, migrate, verify
        run: |
          export RINGSAYS_BOOTSTRAP_ADMIN_URL=postgresql+psycopg://cloud_admin:cloud_admin@127.0.0.1:5432/postgres
          for r in OWNER APP WORKER BACKOFFICE; do export RINGSAYS_DB_PASSWORD_$r=$(openssl rand -hex 16); done
          python -m app.scripts.bootstrap_db
          python -m app.scripts.bootstrap_db   # idempotent (password rotation path)
          PGPASSWORD=$RINGSAYS_DB_PASSWORD_APP psql -h 127.0.0.1 -U ringsays_app -d ringsays -c "select 1"
          ! PGPASSWORD=wrong psql -h 127.0.0.1 -U ringsays_app -d ringsays -c "select 1"
          RINGSAYS_MIGRATION_DATABASE_URL=postgresql+psycopg://ringsays_owner:$RINGSAYS_DB_PASSWORD_OWNER@127.0.0.1:5432/ringsays alembic upgrade head
          test "$(psql -h 127.0.0.1 -U postgres -d ringsays -Atc "select count(*) from pg_roles where rolname like 'ringsays%' and (rolsuper or rolbypassrls)")" = 0
          test "$(psql -h 127.0.0.1 -U postgres -d ringsays -Atc "select count(*) from pg_policies where policyname='system_roles'")" -ge 20

  # Deployment code: rendered manifests (schemas, kube-linter, Checkov), Terraform (fmt, tflint,
  # Checkov, validate with providers).
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: opentofu/setup-opentofu@v1
        with: { tofu_version: 1.10.6 }
      - uses: terraform-linters/setup-tflint@v4
        with: { tflint_version: v0.64.0 }
      - name: Tools
        run: |
          pip install checkov==3.3.22
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz | tar xz -C /usr/local/bin
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
          curl -sSL https://github.com/stackrox/kube-linter/releases/download/v0.7.6/kube-linter-linux.tar.gz | tar xz -C /usr/local/bin
      - run: deploy/scripts/validate.sh
      - name: tflint (Google ruleset)
        working-directory: deploy/terraform
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          tflint --init --config=$PWD/.tflint.hcl
          for d in modules/platform environments/ksa-staging environments/ksa-production bootstrap; do tflint --chdir=$d --config=$PWD/.tflint.hcl; done
      - name: tofu validate
        working-directory: deploy/terraform
        run: |
          for d in environments/ksa-staging environments/ksa-production bootstrap; do
            tofu -chdir=$d init -backend=false -input=false
            tofu -chdir=$d validate
          done

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Portal API types match admin contract
        run: pnpm --filter @ringsays/portal check:api-types

  # Portal and mobile app (web build) end to end against one local API with MOCK adapters.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      PGPASSWORD: postgres
      RINGSAYS_ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Database roles and schema
        run: |
          psql -h 127.0.0.1 -U postgres -f infra/sql/00-roles.sql
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE ringsays OWNER ringsays_owner"
          cd backend && python -m venv .venv && .venv/bin/pip install -e ".[dev]" && .venv/bin/alembic upgrade head
      - name: Start API (local environment, MOCK sign in)
        # Every app sign in comes from one address here; lift the per address code limit for tests.
        run: cd backend && RINGSAYS_OTP_PER_IP_PER_HOUR=100000 nohup .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &
      - run: pnpm install --frozen-lockfile
      # Workspace libraries ship as built dist (not committed): build them with each app ("..." = with dependencies).
      - run: pnpm --filter "@ringsays/portal..." build
      - run: pnpm --filter @ringsays/portal exec playwright install --with-deps chromium
      - run: pnpm --filter @ringsays/portal e2e
      - name: Mobile app web build (MOCK push token so MOCK push delivers to the browser)
        run: pnpm --filter "@ringsays/client..." build && pnpm --filter @ringsays/mobile export:web
        env:
          EXPO_PUBLIC_RINGSAYS_API_BASE: http://127.0.0.1:8000
          EXPO_PUBLIC_RINGSAYS_PREVIEW_PUSH_TOKEN: mock-web
      - run: pnpm --filter @ringsays/mobile e2e
        env: { E2E_PYTHON: "${{ github.workspace }}/backend/.venv/bin/python" }
      - name: Mock bank (SDK sample) server and app web build
        run: |
          pnpm --filter "@ringsays/react-native-sdk..." build
          pnpm --filter "@mockbank/server..." build
          pnpm --filter @mockbank/app export:web
      - run: pnpm --filter @mockbank/app e2e
        env:
          E2E_PYTHON: "${{ github.workspace }}/backend/.venv/bin/python"
          RINGSAYS_PYTHON: "${{ github.workspace }}/backend/.venv/bin/python"
      - if: failure()
        run: python3 .github/scripts/annotate.py log api.log "API log (last 60 lines)"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            apps/portal/test-results
            apps/mobile/test-results
            examples/mock-bank/app/test-results
            api.log

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, severity: "HIGH,CRITICAL", ignore-unfixed: true, format: json, output: trivy.json, exit-code: "0" }
      - name: Fixable high and critical findings fail the build (listed as annotations)
        run: python3 .github/scripts/annotate.py trivy trivy.json
