openapi: 3.1.0
info:
  title: RingSays Client API
  version: 0.1.0
  description: |
    API for RingSays mobile app and embedded enterprise SDK.
    Access tokens are short lived and bound to a registered device key.
    Address book data is never sent to this API; contact matching runs on device.
servers:
  - url: https://api.ringsays.example/v1
security:
  - bearer: []
tags:
  - name: Auth
  - name: Devices
  - name: Inbox
  - name: Intents
  - name: Preferences
  - name: Privacy

paths:
  /auth/otp:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: Send one time code to phone
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { $ref: "./common.yaml#/components/schemas/E164" }
                locale: { type: string, enum: [en, ar] }
      responses:
        "202":
          description: Code sent if number is valid. Response identical either way to prevent enumeration.
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id, expires_in]
                properties:
                  challenge_id: { type: string, format: uuid }
                  expires_in: { type: integer }
        "429": { $ref: "./common.yaml#/components/responses/TooManyRequests" }

  /auth/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Verify code and register device
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, code, device]
              properties:
                challenge_id: { type: string, format: uuid }
                code: { type: string, pattern: '^\d{6}$' }
                device: { $ref: "#/components/schemas/DeviceRegistration" }
      responses:
        "200":
          description: Verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "429": { $ref: "./common.yaml#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Rotate refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token, device_signature]
              properties:
                refresh_token: { type: string }
                device_signature:
                  type: string
                  description: Signature over refresh token with device private key.
      responses:
        "200":
          description: New token pair; old refresh token revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }

  /devices/{device_id}/push-tokens:
    put:
      tags: [Devices]
      operationId: updatePushTokens
      summary: Update push tokens for a device
      parameters:
        - name: device_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushTokens" }
      responses:
        "204": { description: Updated. }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }

  /inbox:
    get:
      tags: [Inbox]
      operationId: getInbox
      summary: Incoming and outgoing intents, cursor synced
      parameters:
        - $ref: "./common.yaml#/components/parameters/Cursor"
        - $ref: "./common.yaml#/components/parameters/Limit"
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
        - name: folder
          in: query
          schema:
            type: string
            enum: [REQUESTS, SCHEDULED, HISTORY]
      responses:
        "200":
          description: Inbox page.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/IntentDisplay" }
                  next_cursor: { type: [string, "null"] }

  /me/intents/{intent_id}:
    get:
      tags: [Inbox]
      operationId: getMyIntent
      summary: One intent addressed to signed in user
      parameters:
        - $ref: "./common.yaml#/components/parameters/IntentId"
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Intent display.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntentDisplay" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }

  /tokens/{token}:
    get:
      tags: [Intents]
      operationId: resolveContextToken
      summary: Resolve Context Token to display payload (enterprise SDK)
      description: |
        Used by the enterprise SDK inside the tenant's own app; no RingSays account needed.
        First resolve binds the token to `RingSays-Device-Id` (SDK install id); other devices are refused.
        Refused after intent completion or expiry. Before the intent window opens, the resolve binds the
        device and returns status REQUESTED; delivery happens when the window opens.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 16, maxLength: 64 }
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Display payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntentDisplay" }
        "403": { $ref: "./common.yaml#/components/responses/Forbidden" }
        "410": { $ref: "./common.yaml#/components/responses/Gone" }

  /tokens/{token}/respond:
    post:
      tags: [Intents]
      operationId: respondViaContextToken
      summary: Respond to an intent from the enterprise SDK
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 16, maxLength: 64 }
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntentResponse" }
      responses:
        "200":
          description: Response applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntentDisplay" }
        "403": { $ref: "./common.yaml#/components/responses/Forbidden" }
        "409": { $ref: "./common.yaml#/components/responses/Conflict" }
        "410": { $ref: "./common.yaml#/components/responses/Gone" }

  /intents/{intent_id}/respond:
    post:
      tags: [Intents]
      operationId: respondToIntent
      summary: Receiver response to an intent
      parameters:
        - $ref: "./common.yaml#/components/parameters/IntentId"
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntentResponse" }
      responses:
        "200":
          description: Response applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntentDisplay" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "409": { $ref: "./common.yaml#/components/responses/Conflict" }
        "410": { $ref: "./common.yaml#/components/responses/Gone" }
        "422": { $ref: "./common.yaml#/components/responses/UnprocessableEntity" }

  /me/preferences:
    get:
      tags: [Preferences]
      operationId: getPreferences
      summary: Get communication rules
      responses:
        "200":
          description: Rules. ETag header carries version for If-Match.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
    put:
      tags: [Preferences]
      operationId: putPreferences
      summary: Replace communication rules
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "412": { description: ETag mismatch. }

  /me/consents:
    get:
      tags: [Privacy]
      operationId: listConsents
      summary: List consents granted by user
      responses:
        "200":
          description: Consents granted by user.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Consent" }

  /me/consents/{consent_id}:
    delete:
      tags: [Privacy]
      operationId: withdrawConsent
      summary: Withdraw a consent
      parameters:
        - name: consent_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Withdrawn. }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }

  /me/export:
    post:
      tags: [Privacy]
      operationId: requestExport
      summary: Download all personal data RingSays holds for this user
      responses:
        "200":
          description: Export document.
          content:
            application/json:
              schema:
                type: object
                required: [generated_at, profile, devices, preferences, consents, communications_received]
                properties:
                  generated_at: { type: string, format: date-time }
                  profile: { type: object }
                  devices: { type: array, items: { type: object } }
                  preferences: { $ref: "#/components/schemas/Preferences" }
                  consents: { type: array, items: { $ref: "#/components/schemas/Consent" } }
                  communications_received: { type: array, items: { type: object } }
                  address_book: { type: string, const: never collected }

  /me:
    delete:
      tags: [Privacy]
      operationId: deleteAccount
      summary: Erase account and all personal data
      responses:
        "202": { description: Erasure scheduled; completes within retention SLA. }

components:
  parameters:
    DeviceId:
      name: RingSays-Device-Id
      in: header
      required: true
      description: SDK installation id (UUID), generated once per app install.
      schema: { type: string, format: uuid }

  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DeviceRegistration:
      type: object
      required: [platform, public_key, app_version]
      properties:
        platform: { type: string, enum: [IOS, ANDROID] }
        public_key:
          type: string
          description: Base64 encoded P-256 public key generated in secure enclave or keystore.
        app_version: { type: string }
        push: { $ref: "#/components/schemas/PushTokens" }

    PushTokens:
      type: object
      properties:
        apns: { type: string }
        pushkit: { type: string }
        fcm: { type: string }

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, user_id, device_id]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
        user_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }

    IntentDisplay:
      type: object
      required: [intent_id, status, verification_level, intent_source, priority, expected_duration_min, valid_until, actions]
      properties:
        intent_id: { $ref: "./common.yaml#/components/schemas/IntentId" }
        status: { $ref: "./common.yaml#/components/schemas/IntentStatus" }
        created_at: { type: string, format: date-time }
        scheduled_slot:
          oneOf:
            - { $ref: "./common.yaml#/components/schemas/Slot" }
            - { type: "null" }
        proposed_slots:
          type: array
          items: { $ref: "./common.yaml#/components/schemas/Slot" }
        organisation_name: { type: [string, "null"] }
        department_name: { type: [string, "null"] }
        agent_display_name: { type: [string, "null"] }
        verification_level: { $ref: "./common.yaml#/components/schemas/VerificationLevel" }
        intent_source: { $ref: "./common.yaml#/components/schemas/IntentSource" }
        why: { type: [string, "null"], description: Rendered from approved template in requested language. }
        unverified_subject:
          type: [string, "null"]
          description: Consumer free text. Clients must render in unverified style.
        masked_reference: { type: [string, "null"] }
        priority: { $ref: "./common.yaml#/components/schemas/Priority" }
        expected_duration_min: { type: integer }
        valid_until: { type: string, format: date-time }
        deep_link: { type: [string, "null"], format: uri }
        actions:
          type: array
          items:
            type: string
            enum: [TALK_NOW, LATER, PROPOSE, SCHEDULE, MESSAGE, DECLINE]

    IntentResponse:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [ACCEPT, LATER, PROPOSE, SCHEDULE, MESSAGE, DECLINE]
        later_minutes: { type: integer, enum: [15, 30, 60, 120] }
        proposed_slots:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "./common.yaml#/components/schemas/Slot" }
        slot:
          description: For SCHEDULE, one of the slots offered by caller.
          $ref: "./common.yaml#/components/schemas/Slot"
        decline_reason: { $ref: "./common.yaml#/components/schemas/DeclineReason" }

    TimeWindow:
      type: object
      required: [days, start, end]
      properties:
        days:
          type: array
          items: { type: string, enum: [MON, TUE, WED, THU, FRI, SAT, SUN] }
        start: { type: string, pattern: '^\d{2}:\d{2}$' }
        end: { type: string, pattern: '^\d{2}:\d{2}$' }

    Preferences:
      type: object
      required: [timezone, rules]
      properties:
        timezone: { type: string, examples: ["Asia/Riyadh"] }
        verified_businesses_only: { type: boolean, default: false }
        night_mode:
          oneOf:
            - { $ref: "#/components/schemas/TimeWindow" }
            - { type: "null" }
        rules:
          type: array
          items:
            type: object
            required: [match, action]
            properties:
              match:
                type: object
                properties:
                  category: { type: string, enum: [WORK, FAMILY, UNKNOWN, SALES, DELIVERY, BANK, GOVERNMENT] }
                  min_verification: { $ref: "./common.yaml#/components/schemas/VerificationLevel" }
                  min_priority: { $ref: "./common.yaml#/components/schemas/Priority" }
                  max_duration_min: { type: integer }
              window:
                oneOf:
                  - { $ref: "#/components/schemas/TimeWindow" }
                  - { type: "null" }
              action:
                type: string
                enum: [ALLOW, HOLD_UNTIL_WINDOW, REQUEST_FIRST, MESSAGE_ONLY, BLOCK]

    Consent:
      type: object
      required: [consent_id, grantee, purpose, granted_at]
      properties:
        consent_id: { type: string, format: uuid }
        grantee: { type: string, description: Organisation display name }
        purpose: { type: string }
        scope: { type: string }
        granted_at: { type: string, format: date-time }
        withdrawn_at: { type: [string, "null"], format: date-time }
